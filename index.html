<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup Form</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="box1">
        <h1>Welcome Page</h1>
        <p>Sign in to <br />continue access</p>
      </div>
      <div class="box2">
        <h1>Sign In</h1>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Email Address"
        />
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Password"
        />
        <button class="btn_continue" type="submit">
          CONTINUE <i class="fa-solid fa-chevron-right"></i>
        </button>
        <p>or Connect with Social Media</p>
        <button class="btn_twitter" type="button">
          <i class="fa-brands fa-twitter"></i> Sign In With Twitter
        </button>
        <button class="btn_facebook" type="button">
          <i class="fa-brands fa-facebook-f"></i> Sign In With Facebook
        </button>
      </div>
    </div>
  </body>
</html>
